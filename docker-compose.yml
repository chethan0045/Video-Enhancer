version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cine-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cine-remaster

  redis:
    image: redis:7-alpine
    container_name: cine-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cine-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./python-engine:/app/python-engine
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cine-remaster
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PYTHON_ENGINE_PATH=/app/python-engine
    depends_on:
      - mongodb
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cine-frontend
    restart: unless-stopped
    ports:
      - '4200:80'
    environment:
      - API_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
